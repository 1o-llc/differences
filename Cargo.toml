[package]
name = "differences"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
authors = ["James Hunt <james@1o.business>"]
license = "MIT OR Apache-2.0"
description = "Every kind of history a project keeps, side by side, on the command line: `differences <kind> <a> <b>` for the tree and the counts at two points, the receipts since a point, a task's revisions, the lines jobs touched, two readings of one question and the task histories; each line declared once as an xccute line"
repository = "https://github.com/1o-llc/differences"
readme = "README.md"
keywords = ["1o", "history", "diff", "cli", "differences"]
categories = ["development-tools", "command-line-utilities"]
include = ["src/**", "tests/**", "Cargo.toml", "LICENSE*", "README*", "CHANGELOG*"]

[[bin]]
name = "differences"
path = "src/main.rs"

[dependencies]
# the one API: every kind of history, side by side
differences_kit = "0.1.0"
tree_history = "0.1.0"
# every line declared once (simple_impl_derive over xccute_contract), its statuses read by xccute's runtime
simple_impl_derive = "0.2.7"
xccute_contract = "0.1.3"
xccute_runtime = "0.1.2"
# self install: plan, install from the plan, receipt
installation = "0.2.2"
serde_json = "1"
